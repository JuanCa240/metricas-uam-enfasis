name: Auditorías Lighthouse UAM

on:
  schedule:
    # Todos los días a las 8:00 a. m. de Colombia (UTC-5)
    - cron: "0 13 * * *"

    # Todos los lunes a las 9:00 a. m. de Colombia (UTC-5)
    - cron: "0 14 * * 1"

  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil que deseas ejecutar"
        required: true
        type: choice
        options:
          - mobile
          - desktop

permissions:
  contents: read

jobs:
  mobile:
    if: >-
      github.event.schedule == '0 13 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.profile == 'mobile')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CYPRESS_DEVICE_PROFILE: mobile
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SHEET_NAME: ${{ secrets.SHEET_NAME }}
      GOOGLE_APPLICATION_CREDENTIALS: credentials/google-service-account.json

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar credenciales de Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          mkdir -p credentials
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > credentials/google-service-account.json
          node -e "JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8')); console.log('Credenciales JSON válidas')"

      - name: Ejecutar auditorías móviles
        run: npx cypress run

      - name: Enviar resultados a Google Sheets
        if: always()
        run: |
          if [ -f cypress/fixtures/lighthouse-metrics.json ]; then
            node scripts/push-to-sheet.js
          else
            echo "No se encontró el archivo de métricas."
            exit 1
          fi

      - name: Guardar historial JSON como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metricas-lighthouse-mobile
          path: cypress/fixtures/lighthouse-metrics.json
          if-no-files-found: ignore
          retention-days: 30

  desktop:
    if: >-
      github.event.schedule == '0 14 * * 1' ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.profile == 'desktop')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CYPRESS_DEVICE_PROFILE: desktop
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SHEET_NAME: ${{ secrets.SHEET_NAME }}
      GOOGLE_APPLICATION_CREDENTIALS: credentials/google-service-account.json

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar credenciales de Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          mkdir -p credentials
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > credentials/google-service-account.json
          node -e "JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8')); console.log('Credenciales JSON válidas')"

      - name: Ejecutar auditorías de escritorio
        run: npx cypress run

      - name: Enviar resultados a Google Sheets
        if: always()
        run: |
          if [ -f cypress/fixtures/lighthouse-metrics.json ]; then
            node scripts/push-to-sheet.js
          else
            echo "No se encontró el archivo de métricas."
            exit 1
          fi

      - name: Guardar historial JSON como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metricas-lighthouse-desktop
          path: cypress/fixtures/lighthouse-metrics.json
          if-no-files-found: ignore
          retention-days: 30