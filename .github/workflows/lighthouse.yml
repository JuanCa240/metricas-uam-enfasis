name: Auditorias Lighthouse UAM

on:
  schedule:
    # Todos los dias a las 8:00 a. m. de Colombia
    - cron: "0 13 * * *"
    # Todos los lunes a las 9:00 a. m. de Colombia
    - cron: "0 14 * * 1"

  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil de auditoria"
        required: true
        type: choice
        options:
          - mobile
          - desktop

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SHEET_NAME: ${{ secrets.SHEET_NAME }}
      GOOGLE_APPLICATION_CREDENTIALS: credentials/google-service-account.json

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar credenciales de Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          mkdir -p credentials
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > credentials/google-service-account.json
          node -e "JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8')); console.log('Credenciales validas')"

      - name: Seleccionar perfil
        id: profile
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "device=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 14 * * 1" ]; then
            echo "device=desktop" >> "$GITHUB_OUTPUT"
          else
            echo "device=mobile" >> "$GITHUB_OUTPUT"
          fi

      - name: Recuperar historial de metricas
        uses: actions/cache/restore@v4
        with:
          path: cypress/fixtures/lighthouse-metrics.json
          key: lighthouse-metrics-${{ github.run_id }}
          restore-keys: |
            lighthouse-metrics-

      - name: Inicializar historial si no existe
        shell: bash
        run: |
          mkdir -p cypress/fixtures
          if [ ! -f cypress/fixtures/lighthouse-metrics.json ]; then
            echo '[]' > cypress/fixtures/lighthouse-metrics.json
          fi

      - name: Ejecutar auditorias
        env:
          CYPRESS_DEVICE_PROFILE: ${{ steps.profile.outputs.device }}
        run: npx cypress run

      - name: Sincronizar Google Sheets
        if: always()
        run: node scripts/push-to-sheet.js

      - name: Guardar historial actualizado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cypress/fixtures/lighthouse-metrics.json
          key: lighthouse-metrics-${{ github.run_id }}

      - name: Guardar JSON como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-metricas-${{ steps.profile.outputs.device }}
          path: cypress/fixtures/lighthouse-metrics.json
          if-no-files-found: ignore
          retention-days: 30
